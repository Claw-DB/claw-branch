[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
unsound = "deny"
yanked = "deny"

[licenses]
unlicensed = "deny"
allow = ["Apache-2.0", "MIT", "MPL-2.0", "Unicode-DFS-2016"]
copyleft = "warn"

[bans]
multiple-versions = "warn"
