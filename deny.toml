[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
allow = [
	"Apache-2.0",
	"BSD-3-Clause",
	"CDLA-Permissive-2.0",
	"MIT",
	"ISC",
	"MPL-2.0",
	"Unicode-3.0",
	"Unicode-DFS-2016",
	"Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
